[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-agrivision"
version = "0.2.0"
description = "AI-Powered Crop Intelligence & Decision Support System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.0.0",
    "opencv-python>=4.9.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "gunicorn>=21.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "aiofiles>=23.0.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.0",
    "jinja2>=3.1.0",
    "weasyprint>=62.0",
    "python-telegram-bot>=20.0",
    "redis>=5.0.0",
    "celery>=5.3.0",
    "ray>=2.10.0",
    "mlflow>=2.10.0",
    "wandb>=0.16.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "sentence-transformers>=2.2.0",
    "chromadb>=0.5.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-ollama>=0.1.0",
    "openai>=1.0.0",
    "tiktoken>=0.5.0",
    "faiss-cpu>=1.7.4",
    "sentinelhub>=3.11.0",
    "rasterio>=1.3.0",
    "shapely>=2.0.0",
    "folium>=0.16.0",
    "geopandas>=0.14.0",
    "segmentation-models-pytorch>=0.3.3",
    "albumentations>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]
gpu = ["torch>=2.0.0+cu118", "torchvision>=0.15.0+cu118"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true